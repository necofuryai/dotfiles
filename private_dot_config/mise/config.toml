[tools]
bun = "1.3.14"
go = "1.27.1"
node = "24"
"npm:mcporter" = "0.7.3"
"npm:tdd-guard" = "1.3.0"
"npm:track-cli" = "4.2.0"
python = "3.14"
ruby = "4.0.6"
"go:golang.org/x/tools/gopls" = "0.23.0"
golangci-lint = "2.14.0"
"npm:typescript-language-server" = "6.0.0"

[tools."npm:@opengsd/gsd-pi"]
version = "1.20.1"
allow_builds = ["@opengsd/gsd-pi"]
trust_policy_excludes = ["@mariozechner/clipboard-darwin-x64@0.3.6", "@mariozechner/clipboard-darwin-arm64@0.3.6", "@mariozechner/clipboard-linux-x64-gnu@0.3.6", "@mariozechner/clipboard-linux-x64-musl@0.3.6", "@mariozechner/clipboard-win32-x64-msvc@0.3.6", "@mariozechner/clipboard-linux-arm64-gnu@0.3.6", "@mariozechner/clipboard-darwin-universal@0.3.6", "@mariozechner/clipboard-linux-arm64-musl@0.3.6", "@mariozechner/clipboard-win32-arm64-msvc@0.3.6", "@mariozechner/clipboard-linux-riscv64-gnu@0.3.6"]

[settings]
idiomatic_version_file_enable_tools = ["ruby", "go", "node"]

# TEMPORARY (2026-09-20): disable automatic cache pruning.
# `mise cache prune` follows symlinks out of the cache and deletes files inside
# installed tools; it destroyed npm:@opengsd/gsd-pi here on 2026-09-20.
#   report: https://github.com/jdx/mise/discussions/13420
#   fix:    https://github.com/jdx/mise/pull/13424  (open as of 2026-09-20)
# "0s" stops auto_prune (which fires on ~1% of all mise invocations). It does NOT
# protect a manually run `mise cache prune`, which falls back to 30d — avoid that
# command until the fix ships. Use `mise cache clear` to reclaim space instead.
# REVERT (delete this line) once mise ships the #13424 fix.
cache_prune_age = "0s"
