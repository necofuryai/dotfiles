---
name: Gitleaks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan Git history
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" |
            sha256sum --check --strict
          tar --extract --gzip --file "${archive}" \
            --directory "${RUNNER_TEMP}" gitleaks

      - name: Scan all Git refs
        shell: bash
        run: |
          "${RUNNER_TEMP}/gitleaks" git \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --log-opts="--all HEAD" \
            .

      - name: Check commit messages for local paths
        shell: bash
        run: |
          if git log --all HEAD --format='%B' |
            grep --extended-regexp '/Users/[A-Za-z0-9._-]+/' >/dev/null
          then
            echo "::error::Hard-coded macOS home path found in a commit message."
            exit 1
          fi
